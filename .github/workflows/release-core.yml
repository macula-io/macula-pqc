name: Release to crates.io

# Publishes every crate from one pushed release tag. THE TAG IS THE
# RELEASE: there is no approval step.
#
# - A pushed tag vX.Y.Z runs `verify`: scripts/check-release.sh passes
#   (see below), the full gate passes, and a dry-run publish succeeds.
#   Then `publish` runs in the `crates-io` environment. That environment
#   admits only `v*.*.*` tags and holds the crates.io API token, so the
#   token is readable by this job on a release tag and by nothing else:
#   not a branch run, not another workflow.
# - ⛔ TWO CREDENTIALS. A crate already on crates.io publishes by Trusted
#   Publishing: crates-io-auth-action trades the job's OIDC identity for a
#   short-lived token, and every such crate is trusted-publishing-only. The
#   API token is used only for a crate crates.io has never seen, which
#   Trusted Publishing cannot create. scripts/publish-crates.sh has the
#   details; verify prints its plan before anything is published.
# - Who can publish is therefore who can push a `v*` tag. Today that is
#   the repository's only account. Grant anyone else write access and add
#   a tag ruleset restricting `v*` creation, or the tag stops being a gate.
# - A manual dispatch is a dry run: it runs `verify` for the given tag and
#   never publishes. GitHub only dispatches a workflow that is on the
#   default branch.
#
# ⛔ EVERY FINISHED CRATE IS PUBLISHED. ONLY `macula-pqc` IS A SUPPORTED
# ENTRY POINT. Both halves matter and a later reader will otherwise "simplify"
# one of them away.
#
# WHY ALL ARE PUBLISHED: a mechanical constraint, not a product
# decision. Cargo refuses to publish a crate whose dependencies are not
# themselves on crates.io. `macula-pqc` depends on `macula-pqc-kx`, and so
# on down, so publishing the facade requires publishing everything it
# stands on. The inner crates exist on the registry without being
# advertised.
#
# WHAT TO DEPEND ON IS `macula-pqc`. There is no use case for consuming
# `macula-keccak` alone: nothing in this stack needs SHA-3 outside ML-KEM
# and ML-DSA, because TLS uses SHA-2, and this is not a general-purpose
# Keccak maintained for strangers.
#
# ⛔ WHY THESE ARE SEPARATE CRATES AND NOT ONE WITH MODULES. The layering is
# load-bearing:
#
#   macula-keccak   zeroize only
#   macula-mlkem    keccak + OS randomness + zeroize    NO rustls
#   macula-mldsa    keccak + OS randomness + zeroize    NO rustls
#   macula-pqc-kx    mlkem + rustls + aws-lc-rs
#   macula-pqc       facade
#
# Collapse that and anyone wanting ML-KEM or ML-DSA is forced to take
# rustls and aws-lc-rs with it. Keeping the maths free of the TLS
# envelope is the whole reason the envelope and the maths were separated
# in the first place. IF `macula-mlkem` OR `macula-mldsa` EVER GAINS A
# RUSTLS DEPENDENCY THAT LAYERING IS GONE, and nobody will notice from
# inside the crate.
#
# ⚠ A NEW CRATE CARRIES `publish = false` UNTIL IT IS READY, ON PURPOSE,
# with its reason in `[package.metadata.withheld]`. A tag releases the
# others and leaves it behind: nothing published depends on it, and cargo
# refuses to publish a crate whose dependency is not on the registry, which
# the dry run exercises. scripts/check-release.sh refuses a withheld crate
# with no reason, and names every withheld crate and its reason in the run
# summary, so "0.1.1 published" never reads as "every crate published".
# Clear the flag deliberately, when the crate is ready, never in a sweep
# "to make the workflow work".

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to dry-run, vX.Y.Z. Never publishes.'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

concurrency:
  group: release-crates-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Guard, gate and dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # ⛔ `cargo publish --workspace` EXITS 0 WHEN EVERY CRATE CARRIES
      # `publish = false`: it warns "nothing to publish" and reports
      # success. Without this step a stray tag would give a green release
      # run that released nothing. The script also refuses a crate whose
      # version is not the tag's, or that is withheld without a reason,
      # and writes what is published and withheld to the run summary. The
      # gate proves each refusal on every commit (test-check-release.sh).
      - name: Publishable at the tag's version, withheld crates named
        run: ./scripts/check-release.sh "$RELEASE_TAG"

      # A tag push is a separate event from the branch push CI validated,
      # so there is no prior output to reuse. Same script as the hook and CI.
      - run: ./scripts/test.sh

      # Packages every crate and builds it against the others through a
      # local registry, in dependency order. Needs no registry token.
      - name: Dry-run publish
        run: cargo publish --workspace --dry-run

      # Which crates publish by Trusted Publishing and which, being new,
      # by the API token, asked of crates.io before anything is uploaded.
      - name: Publishing plan
        run: ./scripts/publish-crates.sh --plan


  # The release guard. version-root names the directory whose manifest
  # carries the version this repository publishes; the default is the root.
  release-guard:
    name: The release guard
    uses: macula-io/macula-ci-images/.github/workflows/release-guard.yml@b4c41abb404c32215a2823b7f19ac65b732e1dfe
  publish:
    name: Publish to crates.io
    needs: [verify, release-guard]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      # Trusted Publishing: the OIDC identity crates-io-auth-action trades
      # for a short-lived crates.io token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # In dependency order. After each upload cargo polls crates.io until
      # the crate appears, and gives up after a fixed wait (the setting
      # that lengthens it is unstable). If crates.io is slower than that,
      # rerun: the script asks crates.io what exists, and crates.io refuses
      # the same version twice.
      - name: Publish, in dependency order
        run: ./scripts/publish-crates.sh
        env:
          TRUSTPUB_TOKEN: ${{ steps.auth.outputs.token }}
          FIRST_PUBLISH_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      # cargo skips a withheld crate without a word, so the run that
      # published says what it left behind, and why.
      - name: What was published, and what was withheld
        run: ./scripts/check-release.sh "$GITHUB_REF_NAME"
