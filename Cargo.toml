# The `macula-pqc` workspace, `macula-io/macula-pqc`.
#
# It is its own repository because it is pure mathematics and
# protocol-independent policy: no Erlang, no QUIC, no mesh. It does not
# belong under an Erlang application's `native/`, and we have seen what a
# library-inside-an-application costs: macula-station needs eight
# `git_subdir` dependencies to consume one.
[workspace]
resolver = "2"
members = [
    "macula-keccak",  # Keccak-f[1600]: SHA3 and SHAKE, what ML-KEM is built on
    "macula-mlkem",   # the maths
    "macula-mldsa",   # ML-DSA (FIPS 204): signatures, on the same Keccak
    "macula-pqc-kx",  # the hybrid key exchange groups, including ours
    "macula-pqc",     # the facade: the one place the PQ posture is decided
]

# One version for every crate: they are released together, from one
# `v*` tag, and the release workflow refuses a tag that disagrees.
[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/macula-io/macula-pqc"
categories = ["cryptography"]

# The structural floor: a function's nesting depth, its cognitive
# complexity and its length are hard limits, denied in this workspace and so
# gated by the `cargo clippy ... -D warnings` in scripts/test.sh. The
# thresholds they are measured against are in clippy.toml.
[workspace.lints.clippy]
excessive_nesting = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"

[workspace.dependencies]
# This workspace's own crates: by path to build here, and by version
# because crates.io refuses a dependency that has only a path. Bump these
# with [workspace.package] version above.
macula-keccak = { path = "macula-keccak", version = "0.3.0" }
macula-mlkem = { path = "macula-mlkem", version = "0.3.0" }
macula-mldsa = { path = "macula-mldsa", version = "0.3.0" }
macula-pqc-kx = { path = "macula-pqc-kx", version = "0.3.0" }

# rustls: any 0.23 from .43 up, NOT pinned exactly. These crates are
# published, and an exact pin would hold every consumer on 0.23.43, so a
# rustls security fix could not reach them until this workspace released
# again. The lengths and code points the hybrids depend on are not trusted
# to the version number: the tests measure them from the live components,
# so a rustls that changed them fails the gate here. Cargo.lock holds the
# version this workspace builds and tests against.
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs", "std"] }
# Test-only (macula-pqc-kx's dev-dependencies), so the exact pin reaches no
# consumer.
aws-lc-rs = "=1.18.1"
