[package]
name = "macula-keccak"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Keccak-f[1600], SHA3-256/512 and SHAKE128/256 for macula-pqc's ML-KEM and ML-DSA, verified against NIST's ACVP vectors"
keywords = ["sha3", "shake", "keccak", "fips-202"]
categories.workspace = true

[dependencies]
# Wipes the sponge state when a hash finishes or a reader is dropped. The
# state after absorbing a short message can be run backwards to it, so
# when the message is secret, so is the state. zeroize has no
# dependencies of its own.
zeroize = { version = "1", default-features = false }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
