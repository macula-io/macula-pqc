[package]
name = "macula-mldsa"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ML-DSA (FIPS 204) signatures, keys expanded or as seeds: NIST ACVP-verified, seeded from the OS, secrets wiped, no TLS"
keywords = ["post-quantum", "ml-dsa", "fips-204", "signature", "dilithium"]
categories.workspace = true
# NIST's ACVP vectors are about 28 MB, over crates.io's 10 MB package limit.
# The tests that read them run in this repository, in the gate; the
# published crate carries neither the vectors nor that test.
exclude = ["vectors/", "tests/acvp.rs"]

[features]
# FIPS 204's internal functions, ML-DSA.KeyGen_internal and
# ML-DSA.Sign_internal, with their seeds and randomness supplied by the
# caller, and deterministic signing. FOR TESTING ONLY: NIST's vectors supply
# those values, which is what makes byte-exact verification possible. An
# application signs with fresh randomness from the OS. FIPS 204 section 6:
# these interfaces "should not be made available to applications, as any
# random values required for key generation and signature generation shall
# be generated by the cryptographic module".
internal = []

[dependencies]
macula-keccak = { workspace = true }
# The OS CSPRNG, and nothing else. See the crate docs.
getrandom = "0.4"
# Wipes every secret when it is dropped.
zeroize = "1"

[dev-dependencies]
# This crate's own tests switch `internal` on: NIST's vectors supply their
# own seeds and randomness. A consumer's build leaves it off.
macula-mldsa = { path = ".", features = ["internal"] }
serde_json = "1"

[lints]
workspace = true
