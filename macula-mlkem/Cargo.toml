[package]
name = "macula-mlkem"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ML-KEM (FIPS 203) for macula-pqc: NIST ACVP-verified, seeded from the OS, secrets wiped"
keywords = ["post-quantum", "ml-kem", "kem", "fips-203", "kyber"]
categories.workspace = true

[features]
# FIPS 203's seeded key generation and encapsulation (Algorithms 16 and
# 17), and the arithmetic they are built from. FOR TESTING ONLY: FIPS 203
# sections 3.3 and 6 say these interfaces "should not be made available to
# applications other than for testing purposes", and that the random seeds
# "shall be generated by the cryptographic module". Whoever chooses `m`
# knows the shared secret.
internal = []

[dependencies]
macula-keccak = { workspace = true }
# The OS CSPRNG, and nothing else. See the crate docs.
getrandom = "0.4"
# Wipes every secret when it is dropped: seeds, keys, noise, the message,
# shared secrets. Raf's choice over hand-written volatile writes, which
# would need unsafe code.
zeroize = "1"

[dev-dependencies]
# This crate's own tests and examples switch `internal` on: the ACVP
# vectors and the timing harness supply their own seeds. A build of the
# library alone, which is what a consumer gets, leaves it off.
macula-mlkem = { path = ".", features = ["internal"] }
serde_json = "1"

[lints]
workspace = true
